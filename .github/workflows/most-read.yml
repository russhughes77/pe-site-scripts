# Most read: refreshes most-read.json each morning for the homepage MOST READ label.
# Runs at 05:07 UTC (after midnight UK time all year), and on demand from the
# Actions tab ("Most read", then "Run workflow").
# Needs the PLAUSIBLE_API_KEY secret. Optional repository variable PLAUSIBLE_SITE_ID
# if the site is registered in Plausible under a different name.
name: Most read

on:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: most-read
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Ask Plausible for yesterday's reads
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE_ID: ${{ vars.PLAUSIBLE_SITE_ID }}
        run: python3 scripts/most_read.py

      - name: Save it if it changed
        id: save
        run: |
          if [ ! -f most-read.json ]; then
            echo "No file to save."
            echo "changed=no" >> "$GITHUB_OUTPUT"
          elif git diff --quiet -- most-read.json && git ls-files --error-unmatch most-read.json >/dev/null 2>&1; then
            echo "No change."
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add most-read.json
            git commit -m "Most read: $(date -u +%F)"
            git push
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to republish
        if: steps.save.outputs.changed == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will pick it up on its own."
