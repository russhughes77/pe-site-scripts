# Heroes: refreshes heroes.json, and lean WebP copies of the hero pictures in heroes/, for the homepage hero
# (pe-site.js v9.1 and v9.2).
# Runs every 30 minutes, so a newly tagged Hero article reaches the homepage within about 40 minutes
# (30 for this job, up to 10 for browsers to drop their old copy). It saves a commit only when the
# list changes, or once a day to show it is still running. Also runs on demand from the Actions tab
# ("Heroes", then "Run workflow"), which is the way to get a new hero on at once.
# No secrets needed: it reads the public blog feed.
name: Heroes

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: heroes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install the picture tool
        run: pip install --quiet pillow

      - name: Read the Hero feed and make lean pictures
        run: python3 scripts/heroes.py

      - name: Save it if it changed
        id: save
        run: |
          git add -A heroes.json
          if [ -d heroes ]; then git add -A heroes; fi
          # a deleted last picture leaves no folder, so stage removals too
          git add -u heroes 2>/dev/null || true
          if [ ! -f heroes.json ]; then
            echo "No file to save."
            echo "changed=no" >> "$GITHUB_OUTPUT"
          elif git diff --cached --quiet && git ls-files --error-unmatch heroes.json >/dev/null 2>&1; then
            echo "No change."
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Heroes: $(date -u +%FT%H:%MZ)"
            git pull --rebase origin main || true
            git push
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to republish
        if: steps.save.outputs.changed == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will pick it up on its own."
